<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Sorting Master - AI Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        .container { display: flex; height: 100vh; gap: 20px; padding: 20px; }
        .left-panel {
            flex: 1; display: flex; flex-direction: column; gap: 15px;
            background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); overflow: hidden;
        }
        .camera-feed {
            flex: 1; background: #000; border-radius: 15px; overflow: hidden;
            position: relative; border: 2px solid rgba(0,255,100,0.3);
            box-shadow: 0 0 20px rgba(0,255,100,0.2);
        }
        .camera-feed img { width: 100%; height: 100%; object-fit: cover; }
        .camera-feed .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
        }
        .controls { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 15px 20px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-scan {
            background: linear-gradient(135deg, #00ff87 0%, #00b386 100%);
            color: #000; box-shadow: 0 5px 20px rgba(0,255,135,0.3);
        }
        .btn-scan:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,255,135,0.5); }
        .btn-scan:active { transform: translateY(-1px); }
        .btn-scan:disabled { background: #555; color: #aaa; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-reset {
            background: rgba(255,255,255,0.1); color: #fff;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .btn-reset:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card {
            background: rgba(0,255,135,0.1); padding: 12px; border-radius: 10px;
            border: 1px solid rgba(0,255,135,0.3); text-align: center; color: #fff;
        }
        .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 5px; }
        .stat-value { font-size: 20px; font-weight: bold; color: #00ff87; }
        .right-panel {
            flex: 1; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
            display: flex; flex-direction: column;
        }
        .canvas-container { flex: 1; border-radius: 15px; overflow: hidden; background: #000; position: relative; }
        .result-panel {
            margin-top: 20px; background: rgba(0,255,135,0.1); padding: 20px;
            border-radius: 15px; border: 2px solid rgba(0,255,135,0.3);
            color: #fff; text-align: center; opacity: 0; transition: all 0.5s ease;
        }
        .result-panel.active { opacity: 1; animation: slideUp 0.5s ease; }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .result-title { font-size: 14px; opacity: 0.8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .result-label { font-size: 32px; font-weight: bold; color: #00ff87; margin-bottom: 10px; }
        .result-confidence { font-size: 18px; opacity: 0.9; }
        .confidence-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .confidence-fill { height: 100%; background: linear-gradient(90deg, #00ff87 0%, #00b386 100%); width: 0%; transition: width 0.5s ease; }
        .title {
            color: #fff; text-align: center; font-size: 24px; font-weight: bold;
            margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;
            background: linear-gradient(135deg, #00ff87, #00b386);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .loading {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); color: #00ff87;
            font-size: 18px; text-align: center; z-index: 10;
        }
        .loading.active { display: block; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(0,255,135,0.2);
            border-top-color: #00ff87; border-radius: 50%; margin: 0 auto 10px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1 class="title">Scan</h1>
            <div class="camera-feed">
                <img id="cameraFeed" src="" alt="Camera Feed">
                <div class="overlay"></div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>Klassifiziere...</div>
                </div>
            </div>
            <div class="controls">
                <button class="btn btn-scan" id="scanBtn" onclick="captureAndClassify()">SCAN</button>
                <button class="btn btn-reset" onclick="resetAnimation()">RESET</button>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Letzte Klasse</div>
                    <div class="stat-value" id="lastClass">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Confidence</div>
                    <div class="stat-value" id="lastConfidence">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Scans</div>
                    <div class="stat-value" id="scanCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" id="status">Ready</div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <h1 class="title">Animation</h1>
            <div class="canvas-container" id="canvasContainer"></div>
            <div class="result-panel" id="resultPanel">
                <div class="result-title">Erkannt!</div>
                <div class="result-label" id="resultLabel">-</div>
                <div class="result-confidence" id="resultConfidenceText">-</div>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scanCount = 0;
        let scene, camera, renderer, stickman, trash;
        let lastFrame = null;

        // Kamera-Frame Polling
        async function pollCamera() {
            try {
                const res = await fetch('/api/camera-frame');
                const data = await res.json();
                if (data.frame) {
                    document.getElementById('cameraFeed').src = 'data:image/jpeg;base64,' + data.frame;
                    lastFrame = data.frame;
                    document.getElementById('status').textContent = 'Ready';
                } else {
                    document.getElementById('status').textContent = 'Keine Kamera';
                }
            } catch {
                document.getElementById('status').textContent = 'Fehler';
            }
            setTimeout(pollCamera, 100);
        }

        // Three.js Setup
        function initScene() {
            const container = document.getElementById('canvasContainer');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 8;
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 5, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const grid = new THREE.GridHelper(20, 20, 0x00ff87, 0x00ff87);
            grid.position.y = -2;
            scene.add(grid);

            createStickman();
            createTrash();
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        function createStickman() {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshPhongMaterial({ color: 0xffaa66 });
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x000000 });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), skinMat);
            head.position.y = 2;
            head.castShadow = true;
            group.add(head);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.2, 32), bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            group.add(body);

            const armGeom = new THREE.CylinderGeometry(0.1, 0.1, 1.2, 32);
            const leftArm = new THREE.Mesh(armGeom, bodyMat);
            leftArm.position.set(-0.7, 1.3, 0);
            leftArm.rotation.z = Math.PI / 6;
            leftArm.castShadow = true;
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeom, bodyMat);
            rightArm.position.set(0.7, 1.3, 0);
            rightArm.rotation.z = -Math.PI / 6;
            rightArm.castShadow = true;
            group.add(rightArm);

            group.position.x = -3;
            stickman = group;
            scene.add(group);
        }

        function createTrash() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(1, 1, 2, 32),
                new THREE.MeshPhongMaterial({ color: 0x666666 })
            );
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            const lid = new THREE.Mesh(
                new THREE.CylinderGeometry(1.1, 1.1, 0.2, 32),
                new THREE.MeshPhongMaterial({ color: 0x444444 })
            );
            lid.position.y = 1.1;
            lid.castShadow = true;
            group.add(lid);

            group.position.x = 3;
            trash = group;
            scene.add(group);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (stickman) stickman.rotation.y = Math.sin(Date.now() * 0.001) * 0.2;
            renderer.render(scene, camera);
        }

        function throwAnimation() {
            return new Promise(resolve => {
                const projectile = new THREE.Mesh(
                    new THREE.SphereGeometry(0.3, 32, 32),
                    new THREE.MeshPhongMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.8, 0.5) })
                );
                projectile.position.set(stickman.position.x, 2, 0);
                projectile.castShadow = true;
                scene.add(projectile);

                gsap.to(projectile.position, {
                    x: trash.position.x, y: trash.position.y + 0.5, z: 0,
                    duration: 1.2, ease: "power2.out",
                    onComplete: () => {
                        scene.remove(projectile);
                        gsap.to(trash.children[1].rotation, { x: Math.PI / 3, duration: 0.5, ease: "power2.out" });
                        resolve();
                    }
                });

                gsap.to(stickman.rotation, { z: 0.3, duration: 0.6, ease: "power2.inOut" });
            });
        }

        async function captureAndClassify() {
            if (!lastFrame) { alert('Kein Kamerabild verfügbar'); return; }
            const btn = document.getElementById('scanBtn');
            const loading = document.getElementById('loading');
            btn.disabled = true;
            loading.classList.add('active');
            document.getElementById('status').textContent = 'Scanning...';

            try {
                const res = await fetch('/api/classify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: 'data:image/jpeg;base64,' + lastFrame })
                });
                const data = await res.json();

                if (data.success) {
                    scanCount++;
                    document.getElementById('lastClass').textContent = data.label;
                    document.getElementById('lastConfidence').textContent = (data.confidence * 100).toFixed(1) + '%';
                    document.getElementById('scanCount').textContent = scanCount;
                    document.getElementById('status').textContent = 'Done';

                    await throwAnimation();

                    const resultPanel = document.getElementById('resultPanel');
                    document.getElementById('resultLabel').textContent = data.label;
                    document.getElementById('resultConfidenceText').textContent = 'Confidence: ' + (data.confidence * 100).toFixed(1) + '%';
                    document.getElementById('confidenceFill').style.width = (data.confidence * 100) + '%';
                    resultPanel.classList.add('active');
                } else {
                    document.getElementById('status').textContent = 'Fehler';
                }
            } catch {
                document.getElementById('status').textContent = 'Verbindungsfehler';
            }

            btn.disabled = false;
            loading.classList.remove('active');
        }

        function resetAnimation() {
            document.getElementById('resultPanel').classList.remove('active');
            if (trash && trash.children[1]) {
                gsap.to(trash.children[1].rotation, { x: 0, duration: 0.5, ease: "power2.out" });
            }
            if (stickman) {
                gsap.to(stickman.rotation, { z: 0, duration: 0.5, ease: "power2.out" });
            }
        }

        initScene();
        pollCamera();
    </script>
</body>
</html>
