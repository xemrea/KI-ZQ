<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Sorting Master - AI Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        .container { display: flex; height: 100vh; gap: 20px; padding: 20px; }
        .left-panel {
            flex: 1; display: flex; flex-direction: column; gap: 15px;
            background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); overflow: hidden;
        }
        .camera-feed {
            flex: 1; background: #000; border-radius: 15px; overflow: hidden;
            position: relative; border: 2px solid rgba(0,255,100,0.3);
            box-shadow: 0 0 20px rgba(0,255,100,0.2);
        }
        .camera-feed img { width: 100%; height: 100%; object-fit: cover; }
        .camera-feed .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
        }
        .controls { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 15px 20px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-scan {
            background: linear-gradient(135deg, #00ff87 0%, #00b386 100%);
            color: #000; box-shadow: 0 5px 20px rgba(0,255,135,0.3);
        }
        .btn-scan:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,255,135,0.5); }
        .btn-scan:active { transform: translateY(-1px); }
        .btn-scan:disabled { background: #555; color: #aaa; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-reset {
            background: rgba(255,255,255,0.1); color: #fff;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .btn-reset:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card {
            background: rgba(0,255,135,0.1); padding: 12px; border-radius: 10px;
            border: 1px solid rgba(0,255,135,0.3); text-align: center; color: #fff;
        }
        .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 5px; }
        .stat-value { font-size: 20px; font-weight: bold; color: #00ff87; }
        .right-panel {
            flex: 1; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
            display: flex; flex-direction: column;
        }
        .canvas-container { flex: 1; border-radius: 15px; overflow: hidden; background: #0a0a1a; position: relative; }
        .result-panel {
            margin-top: 15px; background: rgba(0,255,135,0.1); padding: 15px 20px;
            border-radius: 15px; border: 2px solid rgba(0,255,135,0.3);
            color: #fff; text-align: center; opacity: 0; transition: all 0.5s ease;
        }
        .result-panel.active { opacity: 1; animation: slideUp 0.5s ease; }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .result-label { font-size: 28px; font-weight: bold; color: #00ff87; margin-bottom: 6px; }
        .result-confidence { font-size: 16px; opacity: 0.9; }
        .confidence-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .confidence-fill { height: 100%; background: linear-gradient(90deg, #00ff87 0%, #00b386 100%); width: 0%; transition: width 0.5s ease; }
        .title {
            color: #fff; text-align: center; font-size: 22px; font-weight: bold;
            margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;
            background: linear-gradient(135deg, #00ff87, #00b386);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .loading {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); color: #00ff87;
            font-size: 18px; text-align: center; z-index: 10;
        }
        .loading.active { display: block; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(0,255,135,0.2);
            border-top-color: #00ff87; border-radius: 50%; margin: 0 auto 10px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1 class="title">Scan</h1>
            <div class="camera-feed">
                <img id="cameraFeed" src="" alt="Camera Feed">
                <div class="overlay"></div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>Klassifiziere...</div>
                </div>
            </div>
            <div class="controls">
                <button class="btn btn-scan" id="scanBtn" onclick="captureAndClassify()">SCAN</button>
                <button class="btn btn-reset" onclick="resetAnimation()">RESET</button>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Letzte Klasse</div>
                    <div class="stat-value" id="lastClass">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Confidence</div>
                    <div class="stat-value" id="lastConfidence">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Scans</div>
                    <div class="stat-value" id="scanCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" id="status">Ready</div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <h1 class="title">Mülltrennung</h1>
            <div class="canvas-container" id="canvasContainer"></div>
            <div class="result-panel" id="resultPanel">
                <div class="result-label" id="resultLabel">-</div>
                <div class="result-confidence" id="resultConfidenceText">-</div>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scanCount = 0;
        let scene, cam, renderer;
        let bins = {}; // { papier: {group, lid, pivot, color}, muell: {...}, sonstiges: {...} }
        let activeBin = null;

        // Kamera-Stream
        document.getElementById('cameraFeed').src = '/api/camera-feed';

        // Label → Bin mapping
        function getBinKey(label) {
            const l = label.toLowerCase();
            if (l.includes('papier')) return 'papier';
            if (l.includes('plastik') || l.includes('müll') || l.includes('muell')) return 'muell';
            return 'sonstiges';
        }

        // Three.js
        function initScene() {
            const container = document.getElementById('canvasContainer');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 20, 40);

            cam = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
            cam.position.set(0, 4, 11);
            cam.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lichter
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(5, 10, 5);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 1024;
            sun.shadow.mapSize.height = 1024;
            scene.add(sun);

            // Boden
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 30),
                new THREE.MeshPhongMaterial({ color: 0x111122 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -2.5;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(30, 30, 0x223366, 0x223366);
            grid.position.y = -2.49;
            scene.add(grid);

            // 3 Mülleimer erstellen
            createBin('papier',    -4,  0x4488ff, 'PAPIER');
            createBin('muell',      0,  0x44cc66, 'MÜLL');
            createBin('sonstiges',  4,  0xff8833, 'SONSTIGES');

            animate();

            window.addEventListener('resize', () => {
                cam.aspect = container.clientWidth / container.clientHeight;
                cam.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        function createBin(key, x, color, label) {
            const group = new THREE.Group();
            group.position.set(x, -2.5, 0);

            const mat = new THREE.MeshPhongMaterial({ color, shininess: 80 });
            const darkMat = new THREE.MeshPhongMaterial({ color: darkenColor(color), shininess: 60 });

            // Körper
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.75, 3, 32), mat);
            body.position.y = 1.5;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Streifen oben
            const stripe = new THREE.Mesh(
                new THREE.CylinderGeometry(0.92, 0.92, 0.15, 32),
                new THREE.MeshPhongMaterial({ color: 0xffffff, opacity: 0.15, transparent: true })
            );
            stripe.position.y = 2.85;
            group.add(stripe);

            // Deckel-Pivot (Scharnier hinten)
            const lidPivot = new THREE.Group();
            lidPivot.position.set(0, 3.05, -0.9);
            group.add(lidPivot);

            const lid = new THREE.Mesh(
                new THREE.CylinderGeometry(1.0, 1.0, 0.18, 32),
                darkMat
            );
            lid.position.set(0, 0, 0.9);
            lidPivot.add(lid);

            // Knopf auf Deckel
            const knob = new THREE.Mesh(
                new THREE.SphereGeometry(0.15, 16, 16),
                new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 100 })
            );
            knob.position.set(0, 0.12, 0.9);
            lidPivot.add(knob);

            // Label als Sprite
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
            ctx.fillRect(0, 0, 256, 64);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 128, 32);
            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
            sprite.scale.set(2.5, 0.6, 1);
            sprite.position.y = 3.7;
            group.add(sprite);

            scene.add(group);

            bins[key] = { group, lidPivot, color, baseY: group.position.y };
        }

        function darkenColor(hex) {
            const r = Math.floor(((hex >> 16) & 0xff) * 0.6);
            const g = Math.floor(((hex >> 8) & 0xff) * 0.6);
            const b = Math.floor((hex & 0xff) * 0.6);
            return (r << 16) | (g << 8) | b;
        }

        function animate() {
            requestAnimationFrame(animate);
            // Leichte Idle-Bewegung aller Bins
            const t = Date.now() * 0.001;
            Object.values(bins).forEach((bin, i) => {
                bin.group.position.y = bin.baseY + Math.sin(t + i * 1.2) * 0.04;
            });
            renderer.render(scene, cam);
        }

        function openLid(binKey) {
            return new Promise(resolve => {
                const bin = bins[binKey];
                if (!bin) return resolve();

                // Bin aufleuchten
                gsap.to(bin.group.position, { y: bin.baseY + 0.3, duration: 0.3, ease: "back.out(2)" });

                // Deckel öffnen
                gsap.to(bin.lidPivot.rotation, {
                    x: -Math.PI / 2,
                    duration: 0.6,
                    ease: "back.out(1.5)",
                    onComplete: resolve
                });
            });
        }

        function closeLid(binKey) {
            const bin = bins[binKey];
            if (!bin) return;
            gsap.to(bin.lidPivot.rotation, { x: 0, duration: 0.5, ease: "power2.inOut" });
            gsap.to(bin.group.position, { y: bin.baseY, duration: 0.4, delay: 0.3, ease: "power2.inOut" });
        }

        function throwBall(binKey) {
            return new Promise(resolve => {
                const bin = bins[binKey];
                const targetX = bin.group.position.x;

                const ball = new THREE.Mesh(
                    new THREE.SphereGeometry(0.25, 24, 24),
                    new THREE.MeshPhongMaterial({ color: bin.color, emissive: bin.color, emissiveIntensity: 0.3 })
                );
                ball.position.set(-9, 1, 0);
                ball.castShadow = true;
                scene.add(ball);

                // Parabolische Bahn
                const startX = -9, endX = targetX;
                const startY = 1, endY = 3.2;
                let progress = 0;

                gsap.to({ p: 0 }, {
                    p: 1,
                    duration: 1.0,
                    ease: "power1.inOut",
                    onUpdate: function() {
                        progress = this.targets()[0].p;
                        ball.position.x = startX + (endX - startX) * progress;
                        ball.position.y = startY + (endY - startY) * Math.sin(progress * Math.PI) * 1.2 + (endY - startY) * progress * 0.3;
                        ball.rotation.z += 0.15;
                    },
                    onComplete: () => {
                        scene.remove(ball);
                        resolve();
                    }
                });
            });
        }

        async function captureAndClassify() {
            const btn = document.getElementById('scanBtn');
            const loading = document.getElementById('loading');
            btn.disabled = true;
            loading.classList.add('active');
            document.getElementById('status').textContent = 'Scanning...';

            try {
                const res = await fetch('/api/classify', { method: 'POST' });
                const data = await res.json();

                if (data.success) {
                    scanCount++;
                    const binKey = getBinKey(data.label);

                    document.getElementById('lastClass').textContent = data.label;
                    document.getElementById('lastConfidence').textContent = (data.confidence * 100).toFixed(1) + '%';
                    document.getElementById('scanCount').textContent = scanCount;
                    document.getElementById('status').textContent = 'Done';

                    // Alten Bin schließen
                    if (activeBin) closeLid(activeBin);

                    // Deckel öffnen dann Ball werfen
                    await openLid(binKey);
                    await throwBall(binKey);
                    activeBin = binKey;

                    // Result Panel
                    document.getElementById('resultLabel').textContent = data.label + ' → ' + binKey.toUpperCase();
                    document.getElementById('resultConfidenceText').textContent = 'Confidence: ' + (data.confidence * 100).toFixed(1) + '%';
                    document.getElementById('confidenceFill').style.width = (data.confidence * 100) + '%';
                    document.getElementById('resultPanel').classList.add('active');

                } else {
                    document.getElementById('status').textContent = 'Fehler';
                }
            } catch {
                document.getElementById('status').textContent = 'Verbindungsfehler';
            }

            btn.disabled = false;
            loading.classList.remove('active');
        }

        function resetAnimation() {
            document.getElementById('resultPanel').classList.remove('active');
            Object.keys(bins).forEach(k => closeLid(k));
            activeBin = null;
        }

        initScene();
    </script>
</body>
</html>
